name: connector-e2e

# The connector against real sshd and real Jupyter (docs/design/connector.md §15): the compose
# profile `connector` (sshd-jupyter, jump), the Go `fixture` tests (A28, A29, A30) and the
# Playwright flows of e2e/tests/connector/ (A27–A31). It runs on pull requests that touch what it
# tests; the `ci` workflow still runs on every pull request, so a path filter that does not match
# leaves the merge rule satisfied. Path filter rule: list the connector, relay and notebook-session
# code, the HTTP routes and contracts the flows call, their data access, the test routes and
# fixtures they seed through, and the e2e setup. Shared server infrastructure (app.ts, auth, db
# schema helpers) is not listed; the weekly schedule and workflow_dispatch cover it. A weekly
# schedule also adds the connector's unit tests on macOS and Windows (their runners have neither
# Docker nor Postgres, so the end-to-end flows stay on Linux).

on:
  pull_request:
    paths:
      - connector/**
      - apps/server/src/relay/**
      - apps/server/src/http/relay/**
      - apps/server/src/http/routes/**
      - apps/server/src/db/connectors/**
      - apps/server/src/db/notebooks/**
      - apps/server/src/db/notebooks.ts
      - apps/server/src/db/jobs/derived.ts
      - apps/server/src/db/schema/connectors.ts
      - apps/server/src/db/schema/notebook-sessions.ts
      - apps/server/src/content/workingCopy*.ts
      - apps/server/src/http/budgets.ts
      - apps/server/test/fixtures/**
      - apps/server/src/db/notebookSubmissions.ts
      - apps/server/src/jobs/**
      - apps/web/src/notebooks/**
      - packages/contracts/src/connector*
      - packages/contracts/src/notebookChannel.ts
      - packages/contracts/src/routes/connections.ts
      - packages/contracts/src/routes/connectors.ts
      - packages/contracts/src/routes/notebookSessions.ts
      - packages/contracts/src/routes/notebooks.ts
      - packages/contracts/src/routes/test.ts
      - packages/contracts/src/routes/workingCopies.ts
      - packages/contracts/src/routes/transfers.ts
      - packages/contracts/src/notebook.ts
      - packages/contracts/src/routes/notebookSubmissions.ts
      - infra/compose.yml
      - infra/docker/sshd-jupyter.Dockerfile
      - infra/docker/jump.Dockerfile
      - infra/connector-fixtures/**
      - scripts/connector-fixture-keys.sh
      - e2e/tests/connector/**
      - e2e/playwright.config.ts
      - e2e/global-setup.ts
      - e2e/paths.ts
      - .github/workflows/connector-e2e.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: parallax
          POSTGRES_PASSWORD: parallax
          POSTGRES_DB: parallax
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U parallax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONNECTOR_E2E: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Jupyter for the local target
        run: |
          python -m pip install jupyter-server==2.21.1 ipykernel==7.4.0 nbformat==5.11.1
          echo "CONNECTOR_E2E_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Build the connector
        run: |
          mkdir -p .local/connector-e2e
          go build -o "$PWD/.local/connector-e2e/parallax-connector" ./cmd/parallax-connector
          echo "CONNECTOR_BIN=$PWD/.local/connector-e2e/parallax-connector" >> "$GITHUB_ENV"
        working-directory: connector
      - name: Fixtures
        run: |
          bash scripts/connector-fixture-keys.sh
          docker compose -f infra/compose.yml --profile connector up -d --build --wait sshd-jupyter jump
      - name: Go tests against real sshd
        working-directory: connector
        run: go test -tags fixture -count=1 ./internal/fixture/
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - name: Playwright flows A27–A31
        run: pnpm test:e2e tests/connector --workers=1
      - name: Fixture logs
        if: failure()
        run: docker compose -f infra/compose.yml --profile connector logs --no-color
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: connector-e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
      - name: Stop the fixtures
        if: always()
        run: docker compose -f infra/compose.yml --profile connector down -v

  other-os:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Connector unit tests
        working-directory: connector
        run: go test ./...
