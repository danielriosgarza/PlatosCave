name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm scenarios
      - name: Runner harness
        run: python3 -m unittest discover -s runner/harness
      - uses: actions/setup-go@v6
        with:
          go-version-file: connector/go.mod
          cache-dependency-path: connector/go.sum
      - name: Connector
        working-directory: connector
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            go vet ./...
            go build -o /dev/null ./cmd/parallax-connector
          done

  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE: parallax-runner-python:dev
      IMAGE_R: parallax-runner-r:dev
    steps:
      - uses: actions/checkout@v5
      - name: Build the Python runner image
        run: bash scripts/runner-image.sh build python
      - name: Build the R runner image
        run: bash scripts/runner-image.sh build r
      - name: Harness tests inside the image
        run: >-
          docker run --rm --network none --user 10001:10001 --pids-limit 64
          --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m --ulimit nofile=256
          --cap-drop ALL --security-opt no-new-privileges
          "$IMAGE" python3 -m unittest discover -s /opt/parallax/harness
      - name: Harness as pid 1 on a job
        run: |
          nonce=0123456789abcdef0123456789abcdef
          { echo "$nonce"; cat runner/protocol/v1/examples/job-full-python-replay.json; } \
            | docker run -i --rm --network none --read-only --user 10001:10001 --pids-limit 64 --memory 512m \
              --cap-drop ALL --security-opt no-new-privileges --ipc private \
              --tmpfs /work:rw,noexec,nosuid,nodev,size=64m --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
              --ulimit core=0 --ulimit nofile=256 --ulimit fsize=33554432 \
              "$IMAGE" python3 /opt/parallax/harness/run.py > frame.txt
          grep -qx -- "--parallax-result $nonce" frame.txt
          grep -qx -- "--parallax-end $nonce" frame.txt
          python3 -c "import json; r = json.loads(open('frame.txt').read().split('\n')[2]); assert r['v'] == 1 and len(r['checks']) >= 1, r"
      - name: Image properties
        run: |
          test "$(docker run --rm --network none "$IMAGE" id -u)" = 10001
          test -z "$(docker run --rm --network none --user 0 "$IMAGE" find / -xdev -type f -perm -4000)"
          label() { docker image inspect --format "{{ index .Config.Labels \"$1\" }}" "$IMAGE"; }
          test -n "$(label org.opencontainers.image.revision)"
          test "$(label org.parallax.runtime)" = python-3.12
          test "$(label org.parallax.harness)" = "$(sed -n 's/^HARNESS_VERSION = "\([0-9]*\)"$/\1/p' runner/harness/run.py)"
          test "$(label org.parallax.content-hash)" = "$(bash scripts/runner-image.sh hash python)"
      - name: R harness tests inside the image
        run: >-
          docker run --rm --network none --user 10001:10001 --pids-limit 64
          --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m --ulimit nofile=256
          --cap-drop ALL --security-opt no-new-privileges
          "$IMAGE_R" python3 -m unittest discover -s /opt/parallax/harness
      - name: R image properties
        run: |
          test "$(docker run --rm --network none "$IMAGE_R" id -u)" = 10001
          test -z "$(docker run --rm --network none --user 0 "$IMAGE_R" find / -xdev -type f -perm -4000)"
          label() { docker image inspect --format "{{ index .Config.Labels \"$1\" }}" "$IMAGE_R"; }
          test -n "$(label org.opencontainers.image.revision)"
          test "$(label org.parallax.runtime)" = r-4.6
          test "$(label org.parallax.harness)" = "$(sed -n 's/^HARNESS_VERSION = "\([0-9]*\)"$/\1/p' runner/harness/run.py)"
          test "$(label org.parallax.content-hash)" = "$(bash scripts/runner-image.sh hash r)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A13 sandbox probes against the images
        run: pnpm test:runner

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: parallax
          POSTGRES_PASSWORD: parallax
          POSTGRES_DB: parallax
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U parallax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://parallax:parallax@127.0.0.1:54329/parallax
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Garage (S3)
        run: |
          docker compose -f infra/compose.yml --profile s3 up -d garage
          bash scripts/garage-init.sh >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: parallax
          POSTGRES_PASSWORD: parallax
          POSTGRES_DB: parallax
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U parallax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.56.1
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
