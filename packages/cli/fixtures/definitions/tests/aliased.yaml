# Two code questions that share their files and checks through an alias. Written out, each
# question has its own entry for main.py, filled from its own folder: aliased/q1/main.py and
# aliased/q2/main.py. aliased.json is the same definition with every content written out.
questions:
  - id: q1
    kind: code
    prompt: Write total(counts) for the counts of one transect.
    points: 2
    runtime: python-3.12
    files: &files
      - { path: main.py, editable: true, hidden: false }
    checks: &checks
      - name: sample
        kind: call
        visibility: public
        file: main.py
        function: total
        args: [[1, 2, 3]]
        expected: { value: 6 }
        compare: { mode: numeric }
  - id: q2
    kind: code
    prompt: Write total(counts) for the counts of two transects.
    points: 2
    runtime: python-3.12
    files: *files
    checks: *checks
  # Written out, -0 stays -0, as JSON.parse gives it for aliased.json.
  - id: q3
    kind: numeric
    prompt: Six fish are counted on each transect. What is the second count minus the first?
    points: 1
    answer: -0
    tolerance: 0.5
